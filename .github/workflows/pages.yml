name: Build and deploy opensaga.dev
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Refresh application sources
        if: github.event_name != 'pull_request'
        run: |
          git submodule update --init --remote vendor/saga vendor/nudat vendor/nusave
          git submodule foreach 'git submodule update --init --recursive'
          git submodule status >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: opensaga-dev-wasm
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Install build dependencies
        run: |
          npm ci
          cargo install wasm-pack --version 0.15.0 --locked
      - name: Check Rust adapters
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --target wasm32-unknown-unknown -- -D warnings
      - name: Build site and applications
        run: npm run build
      - name: Check generated site
        run: npm test
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && vars.PAGES_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
