name: Deploy staging
# Deployments run from main, which builds the staging branch into /staging/.
# A push here only requests that deployment.
on:
  push:
    branches: [staging]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
