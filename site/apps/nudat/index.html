<section class="site-section" aria-labelledby="nudat-title">
  <h1 id="nudat-title" class="site-title">NuDat archive explorer</h1>
  <p class="site-intro">Inspect Traveller's Tales DAT and OBB archives, preview text, and extract files. Your archive stays on your computer.</p>
  <label class="field-label" for="archive-file">Open a DAT or OBB archive</label>
  <input id="archive-file" type="file" accept=".dat,.obb" disabled>
  <p id="status" class="status-message" role="status" aria-live="polite">Loading NuDat…</p>
</section>
<section id="archive-panel" class="site-section" aria-labelledby="archive-title" hidden>
  <h2 id="archive-title" class="site-subtitle">Archive contents</h2>
  <p id="archive-info"></p>
  <label class="field-label" for="filter">Search archive paths</label>
  <input id="filter" type="search" placeholder="e.g. Levels/ or .txt" autocomplete="off">
  <div class="site-actions">
    <button id="verify" type="button">Verify archive</button>
    <button id="download-all" type="button">Download filtered files as ZIP</button>
  </div>
  <p id="results" class="status-message"></p>
  <div class="table-scroll">
    <table>
      <thead><tr><th scope="col">Path</th><th scope="col">Size</th><th scope="col">Encoding</th><th scope="col">Actions</th></tr></thead>
      <tbody id="entries"></tbody>
    </table>
  </div>
  <div class="site-actions">
    <button id="previous" type="button">Previous</button>
    <span id="page-info"></span>
    <button id="next" type="button">Next</button>
  </div>
</section>
<dialog id="preview-dialog">
  <h2 id="preview-title" class="site-subtitle">File preview</h2>
  <pre id="preview-text"></pre>
  <form method="dialog"><button>Close</button></form>
</dialog>
<script type="module" src="./app.js"></script>
